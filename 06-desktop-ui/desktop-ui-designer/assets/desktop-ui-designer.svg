<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- خلفية دائرية -->
  <circle cx="50" cy="50" r="48" fill="url(#mainGradient)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- تأثير زجاجي -->
  <circle cx="50" cy="50" r="48" fill="url(#glassGradient)"/>

  <!-- شكل النافذة -->
  <rect x="25" y="30" width="50" height="40" rx="6" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>

  <!-- أزرار النافذة (إغلاق، تصغير، تكبير) -->
  <circle cx="32" cy="40" r="2.5" fill="#FF5F56" stroke="none"/>
  <circle cx="40" cy="40" r="2.5" fill="#FFBD2E" stroke="none"/>
  <circle cx="48" cy="40" r="2.5" fill="#27C93F" stroke="none"/>

  <!-- أيقونات واجهة المستخدم داخل النافذة -->
  <!-- شريط جانبي -->
  <rect x="28" y="46" width="8" height="20" rx="1" fill="#ffffff" fill-opacity="0.6"/>

  <!-- محتوى رئيسي -->
  <rect x="38" y="46" width="34" height="6" rx="1" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="38" y="54" width="34" height="4" rx="1" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="38" y="60" width="20" height="4" rx="1" fill="#ffffff" fill-opacity="0.3"/>

  <!-- أيقونة قلم (تصميم) -->
  <path d="M68 70 L72 66 L74 68 L70 72 Z M74 66 L76 64 L72 60 L70 62 Z M72 60 L68 64 L66 62 L70 58 Z" fill="#ffffff" fill-opacity="0.8"/>

  <!-- عناصر زخرفية (نقاط صغيرة) -->
  <circle cx="75" cy="25" r="2" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="82" cy="30" r="1.5" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="20" cy="22" r="1.5" fill="#ffffff" fill-opacity="0.3"/>
</svg>